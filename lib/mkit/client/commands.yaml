---
- cmd: init
  help: init mkit client
  request: {}
- cmd: ps
  usage:
    - "[service_id_or_name]"
  help: show services status (alias for status)
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: false
      uri: "/<%=id%>"
  request:
    verb: get
    uri: "/services"
- cmd: status
  usage:
    - "[service_id_or_name] [-e]"
  help: show services status
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: false
      uri: "/<%=id%>"
    - name: errors
      help:
        - -e
        - show validation errors
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "-e"
  request:
    verb: get
    uri: "/services"
- cmd: start
  usage:
    - "<service_id_or_name>"
  help: start service
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
  request:
    verb: put
    uri: "/services/<%=id%>/start"
- cmd: stop
  usage:
    - "<service_id_or_name>"
  help: stop service
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
  request:
    verb: put
    uri: "/services/<%=id%>/stop"
- cmd: restart
  usage:
    - "<service_id_or_name>"
  help: restart service
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
  request:
    verb: put
    uri: "/services/<%=id%>/restart"
- cmd: scale
  usage:
    - "<service_id_or_name> <replicas>"
  help: scale service to specified number of replicas
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
    - name: replicas
      help:
        - replicas
        - Number of replicas
      mandatory: true
  request:
    verb: put
    uri: "/services/<%=id%>/scale"
- cmd: create
  usage:
    - "<service.yaml>"
  help: create new service
  args:
    - name: file
      help:
        - file
        - Service definition
      mandatory: true
    - name: dry_run
      help:
        - --dry-run
        - Preview service without creating
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "--dry-run"
  request:
    verb: post
    uri: "/services"
- cmd: update
  usage:
    - "<service.yaml>"
  help: update service
  args:
    - name: file
      help:
        - file
        - Service definition
      mandatory: true
    - name: dry_run
      help:
        - --dry-run
        - Preview update without applying
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "--dry-run"
  request:
    verb: put
    uri: "/services/<%=id%>"
- cmd: get
  request:
    verb: get
    uri: "/services/<%=id%>"
    defaults:
      format: yaml
  usage:
    - "<service_id_or_name> [options]"
  help: print service configuration
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
    - name: format
      help:
        - -y
        - ...as yaml format (default)
      mandatory: false
      param: "yaml"
      type: flag
      switch:
        - "-y"
    - name: format
      help:
        - -j
        - ...as json format
      mandatory: false
      param: "json"
      type: flag
      switch:
        - "-j"
    - name: format
      help:
        - -t
        - ...as table format (i.e. status format)
      mandatory: false
      param: "table"
      type: flag
      switch:
        - "-t"
    - name: details
      help:
        - -d
        - include service dynamic details
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "-d"
- cmd: rm
  usage:
    - "<service_id_or_name>"
  help: remove service
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
  request:
    verb: delete
    uri: "/services/<%=id%>"
- cmd: migrate
  usage:
    - "<service.yaml>"
  help: migrate local service definition to the new schema version
  args:
    - name: file
      help:
        - file
        - Service definition
      mandatory: true
  request:
    verb: post
    uri: "/services/migrate"
- cmd: exec
  usage:
    - "<service_id_or_name> [options] -- <command> [args...]"
  help: execute a command in a running pod
  request:
    verb: ws_console
    uri: "/services/<%=id%>/pods/exec"
  args:
    - name: id
      help:
        - id
        - Service id or name
      mandatory: true
    - name: pod_id
      help:
        - -p <pod_id>
        - Execute command for specified pod (default first)
      mandatory: false
      param: "<%=pod_id%>"
      type: option
      switch:
        - "-p"
    - name: detached
      help:
        - -d
        - Run command in background
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "-d"
    - name: separator
      help:
        - --
        - Ends mkit options and starts the command
      mandatory: false
      type: separator
    - name: varargs
      help:
        - command
        - Command and options
      mandatory: true
      type: varargs
      param: <%=varargs%>
- cmd: logs
  usage:
    - "<service_id_or_name> [-p <pod_id>] [-f] [-n <lines>]"
  help: view service logs
  request:
    verb: ws # new type
    uri: "/services/<%=id%>/logs"
  args:
    - name: id
      mandatory: true
      # uri: "/<%=id%>" # if exists, add it to main
      type: value # option | flag | value # option takes a value, flag does not takes a value, value is like id_or_name
      help:
        - id
        - Service id or name
    - name: pod_id
      help:
        - -p <pod_id>
        - Show logs for specified pod (default first)
      mandatory: false
      param: "<%=pod_id%>"
      type: option
      switch:
        - "-p"
    - name: follow
      help:
        - -f
        - Follow log output
      mandatory: false
      param: "<%=true%>" # templated. param ou uri - param -> add query parameter name=param_value
      type: flag
      switch:
        - "-f"
    - name: nr_lines
      help:
        - -n <string>
        - Number of lines to show from the end of the logs (default 10)
      mandatory: false
      param: "<%=nr_lines%>"
      type: option
      switch:
        - "-n"
    - name: timestamps
      help:
        - -t
        - Show timestamps
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "-t"
        - "--timestamps"
    - name: details
      help:
        - -d
        - Show extra details
      mandatory: false
      param: "<%=true%>"
      type: flag
      switch:
        - "-d"
- cmd: version
  help: prints mkit client and server version
  request:
    verb: get
    uri: "/mkit/version"
- cmd: proxy
  usage:
    - "<start|stop|restart|status>"
  help: haproxy status and control
  options:
    - cmd: start
      help: start proxy service
      request:
        verb: put
        uri: "/mkit/proxy/start"
    - cmd: stop
      help: stop proxy service
      request:
        verb: put
        uri: "/mkit/proxy/stop"
    - cmd: restart
      help: restarts proxy service
      request:
        verb: put
        uri: "/mkit/proxy/restart"
    - cmd: status
      help: proxy service status
      request:
        verb: get
        uri: "/mkit/proxy/status"
- cmd: vault
  usage:
    - "<list|get|set|delete> [options]"
  help: vault secret management
  options:
    - cmd: list
      help: list all vault secrets
      request:
        verb: get
        uri: "/vault"
    - cmd: list
      help: list vault secrets by scope
      usage:
        - "<scope>"
      args:
        - name: scope
          help:
            - scope
            - Scope (services or mkit)
          mandatory: true
      request:
        verb: get
        uri: "/vault/<%=scope%>"
    - cmd: get
      help: get vault secret metadata
      usage:
        - "<scope>/<path>"
      args:
        - name: scope_path
          help:
            - scope_path
            - Scope/path (e.g., services/my-app/database)
          mandatory: true
      request:
        verb: get
        uri: "/vault/<%=scope_path%>"
    - cmd: set
      help: set vault secret
      usage:
        - "<scope>/<path>#<key> <value>"
      args:
        - name: path_key
          help:
            - path_key
            - Path and key (e.g., services/my-app/database#PASSWORD)
          mandatory: true
        - name: value
          help:
            - value
            - Secret value
          mandatory: true
      request:
        verb: post
        uri: "/vault"
    - cmd: delete
      help: delete vault secret
      usage:
        - "<scope>/<path>#<key>"
      args:
        - name: path_key
          help:
            - path_key
            - Path and key (e.g., services/my-app/database#PASSWORD)
          mandatory: true
      request:
        verb: delete
        uri: "/vault/<%=path_key%>"
- cmd: volume
  usage:
    - "<list|create|delete> [options]"
  help: persistent volume management
  options:
    - cmd: list
      help: list all persistent volumes
      request:
        verb: get
        uri: "/volumes"
    - cmd: create
      help: create persistent volume
      usage:
        - "<name> <capacity>"
      args:
        - name: name
          help:
            - name
            - Volume name
          mandatory: true
        - name: capacity
          help:
            - capacity
            - Volume capacity (e.g., 10Gi)
          mandatory: true
        - name: reclaim_policy
          help:
            - -r
            - Reclaim policy (Retain or Delete)
          mandatory: false
          param: "<%=reclaim_policy%>"
          type: flag
          switch:
            - "-r"
        - name: storage_class
          help:
            - -s
            - Storage class
          mandatory: false
          param: "<%=storage_class%>"
          type: flag
          switch:
            - "-s"
      request:
        verb: post
        uri: "/volumes"
    - cmd: delete
      help: delete persistent volume
      usage:
        - "<name>"
      args:
        - name: name
          help:
            - name
            - Volume name
          mandatory: true
      request:
        verb: delete
        uri: "/volumes/<%=name%>"
- cmd: profile
  usage:
    - "<[set <profile>]|[show]>"
  help: mkit client configuration profile
  options:
    - cmd: set
      help: set mkit client configuration profile
      usage:
        - "<profile>"
      request:
        verb: set
      args:
        - name: profile
          help:
            - profile
            - profile name
          mandatory: true
    - cmd: show
      help: show mkit client current profile
      request:
        verb: show
